apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app-latency
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-latency.json: |
    {
      "title": "MANDATORIO — Latency & Errors",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "RPS (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=~\"available-schedules-(python|go)\"}[5m]))",
              "instant": false
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error rate 5xx (%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{job=~\"available-schedules-(python|go)\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=~\"available-schedules-(python|go)\"}[5m]))",
              "instant": false
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p95 por rota",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (route, le)(rate(http_request_duration_seconds_bucket{job=~\"available-schedules-(python|go)\"}[5m])))",
              "legendFormat": "{{route}}",
              "instant": false
            }
          ]
        },
        {
          "type": "table",
          "title": "Percentual de 5xx por rota",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{job=~\"available-schedules-(python|go)\",status=~\"5..\"}[5m])) by (route) / sum(rate(http_requests_total{job=~\"available-schedules-(python|go)\"}[5m])) by (route)",
              "format": "table",
              "instant": false
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "route",
            "label": "Route",
            "query": "label_values(http_requests_total{job=~\"available-schedules-(python|go)\"}, route)",
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hpa-scaling
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  hpa-scaling.json: |
    {
      "title": "SUGESTAO — HPA Scaling",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "gauge",
          "title": "Réplicas atuais — Python",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 10,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 6 },
                  { "color": "red", "value": 8 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas{deployment=\"available-schedules-python\", namespace=\"apps\"}",
              "instant": true
            }
          ]
        },
        {
          "type": "gauge",
          "title": "Réplicas atuais — Go",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 10,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 6 },
                  { "color": "red", "value": 8 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas{deployment=\"available-schedules-go\", namespace=\"apps\"}",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Histórico de Réplicas no Tempo",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas{deployment=\"available-schedules-python\", namespace=\"apps\"}",
              "legendFormat": "python — réplicas"
            },
            {
              "expr": "kube_deployment_status_replicas{deployment=\"available-schedules-go\", namespace=\"apps\"}",
              "legendFormat": "go — réplicas"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Por que o HPA escalou? (CPU Utilization x Target)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{namespace=\"apps\", pod=~\"available-schedules-python.*\", container!=\"POD\"}[1m]))",
              "legendFormat": "Python — CPU (%)"
            },
            {
              "expr": "1000 * sum(rate(container_cpu_usage_seconds_total{namespace=\"apps\", pod=~\"available-schedules-go.*\", container!=\"POD\"}[1m]))",
              "legendFormat": "Go — CPU (%)"
            },
            {
              "expr": "70",
              "legendFormat": "Target CPU (70%)"
            }
          ]
        }
      ]
    }
