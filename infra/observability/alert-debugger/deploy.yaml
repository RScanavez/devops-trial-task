apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-debugger
  labels: { app: alert-debugger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-debugger }
  template:
    metadata:
      labels: { app: alert-debugger }
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          env:
            - name: PORT
              value: "8080"
            - name: LOG_HEADERS
              value: "true"
            - name: LOG_BODY
              value: "true"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: alert-debugger
spec:
  selector: { app: alert-debugger }
  ports:
    - port: 8080
      targetPort: 8080